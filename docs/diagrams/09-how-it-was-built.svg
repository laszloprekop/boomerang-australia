<text x="52" y="510" font-size="15" font-weight="700" fill="#1a1a1a">What the agents did</text>
<text x="52" y="528" font-size="12" fill="#1a1a1a" xml:space="preserve">analyst: requirements and questions</text>
<text x="52" y="545" font-size="12" fill="#1a1a1a" xml:space="preserve">test engineer: tests, and a throwaway</text>
<text x="52" y="562" font-size="12" fill="#1a1a1a" xml:space="preserve">  build outside the repo to test the tests</text>
<text x="52" y="579" font-size="12" fill="#1a1a1a" xml:space="preserve">  (13 planted faults, each caught)</text>
<text x="52" y="596" font-size="12" fill="#1a1a1a" xml:space="preserve">architect: the design, three revisions</text>
<text x="52" y="613" font-size="12" fill="#1a1a1a" xml:space="preserve">programmer: fills stubs until tests pass</text>
<text x="52" y="630" font-size="12" fill="#1a1a1a" xml:space="preserve">reviewer: a fresh read, changes nothing</text>
<rect x="393" y="488" width="335" height="190" rx="6" fill="#f3e8fd" stroke="#7b1fa2" stroke-width="1.6"/>
<text x="405" y="510" font-size="15" font-weight="700" fill="#1a1a1a">What I did</text>
<text x="405" y="528" font-size="12" fill="#1a1a1a" xml:space="preserve">answered the 20 requirement questions</text>
<text x="405" y="545" font-size="12" fill="#1a1a1a" xml:space="preserve">chose between the design options</text>
<text x="405" y="562" font-size="12" fill="#1a1a1a" xml:space="preserve">sent the architecture back twice</text>
<text x="405" y="579" font-size="12" fill="#1a1a1a" xml:space="preserve">read every round's diff before the next</text>
<text x="405" y="596" font-size="12" fill="#1a1a1a" xml:space="preserve">decided on each review finding</text>
<text x="405" y="613" font-size="12" fill="#1a1a1a" xml:space="preserve">moved the lock, openly, three times</text>
<rect x="746" y="488" width="337" height="190" rx="6" fill="#fce8e6" stroke="#b3261e" stroke-width="1.6"/>
<text x="758" y="510" font-size="15" font-weight="700" fill="#1a1a1a">What only a real run found</text>
<text x="758" y="528" font-size="12" fill="#1a1a1a" xml:space="preserve">A hand was a view into the deck and</text>
<text x="758" y="545" font-size="12" fill="#1a1a1a" xml:space="preserve">could not be sent over a socket.</text>
<text x="758" y="562" font-size="12" fill="#1a1a1a" xml:space="preserve">All tests passed: the test connection</text>
<text x="758" y="579" font-size="12" fill="#1a1a1a" xml:space="preserve">passed objects by reference.</text>
<text x="758" y="596" font-size="12" fill="#1a1a1a" xml:space="preserve">Fix: one .toList(). Then a test that</text>
<text x="758" y="613" font-size="12" fill="#1a1a1a" xml:space="preserve">serializes every message of a game.</text>
<text x="758" y="630" font-size="12" fill="#1a1a1a" xml:space="preserve">Also: ./gradlew run had no keyboard.</text>
<rect x="40" y="692" width="1043" height="52" rx="6" fill="#fffbe6" stroke="#c9a400" stroke-width="1.0"/>
<text x="52" y="713" font-size="12" fill="#1a1a1a" xml:space="preserve">After the examiner's lectures (L12, Lecture 16): AGENTS.md, roles, a human gate per stage, tests before code and locked,</text>
<text x="52" y="730" font-size="12" fill="#1a1a1a" xml:space="preserve">an architecture test on imports, a review by a reviewer who changes nothing.</text>
