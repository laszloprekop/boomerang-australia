<rect x="778" y="96" width="305" height="140" rx="6" fill="#fef7e0" stroke="#b06000" stroke-width="1.8"/>
<text x="790" y="118" font-size="15" font-weight="700" fill="#1a1a1a">boomerang · App.kt</text>
<text x="790" y="136" font-size="12" fill="#1a1a1a" xml:space="preserve">+28  −7 lines</text>
<text x="790" y="153" font-size="12" fill="#1a1a1a" xml:space="preserve"></text>
<text x="790" y="170" font-size="12" fill="#1a1a1a" xml:space="preserve">a third argument `alternate`</text>
<text x="790" y="187" font-size="12" fill="#1a1a1a" xml:space="preserve">the usage text names it</text>
<text x="790" y="204" font-size="12" fill="#1a1a1a" xml:space="preserve">passingRuleFor(start)</text>
<text x="790" y="221" font-size="12" fill="#1a1a1a" xml:space="preserve">one line hands the rule to Game</text>
<rect x="778" y="248" width="305" height="274" rx="6" fill="#e6f4ea" stroke="#137333" stroke-width="1.8"/>
<text x="790" y="270" font-size="15" font-weight="700" fill="#1a1a1a">The whole rule</text>
<text x="790" y="287.5" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">object AlternatingPassingRule</text>
<text x="790" y="304.0" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">    : IPassingRule {</text>
<text x="790" y="320.5" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">  override fun passing(round, n)</text>
<text x="790" y="337.0" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">      : Passing {</text>
<text x="790" y="353.5" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">    val evenRound = round % 2 == 0</text>
<text x="790" y="370.0" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">    if (evenRound &amp;&amp; n &gt; 2) {</text>
<text x="790" y="386.5" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">      return Passing(</text>
<text x="790" y="403.0" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">        hands = TO_PREVIOUS,</text>
<text x="790" y="419.5" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">        catch = TO_NEXT)</text>
<text x="790" y="436.0" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">    }</text>
<text x="790" y="452.5" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">    return StandardPassingRule</text>
<text x="790" y="469.0" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">        .passing(round, n)</text>
<text x="790" y="485.5" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">  }</text>
<text x="790" y="502.0" font-size="11.5" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">}</text>
<rect x="40" y="530" width="500" height="110" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="52" y="552" font-size="15" font-weight="700" fill="#1a1a1a">The command that shows it</text>
<text x="52" y="570" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">git diff --stat tests-locked-2 HEAD -- app/src/main</text>
<text x="52" y="587" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">  App.kt                      | 28 +++++++---</text>
<text x="52" y="604" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">  AlternatingPassingRule.kt   | 14 +++++++</text>
<text x="52" y="621" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">  2 files changed</text>
<rect x="558" y="536" width="525" height="104" rx="6" fill="#fffbe6" stroke="#c9a400" stroke-width="1.0"/>
<text x="570" y="558" font-size="15" font-weight="700" fill="#1a1a1a">Why it worked</text>
<text x="570" y="576" font-size="12" fill="#1a1a1a" xml:space="preserve">Game asks IPassingRule once per round and hands the answer to DraftPhase.</text>
<text x="570" y="593" font-size="12" fill="#1a1a1a" xml:space="preserve">DraftPhase knows no direction: it uses Direction.receiver(seat, playerCount).</text>
<text x="570" y="610" font-size="12" fill="#1a1a1a" xml:space="preserve">The rule returns both directions (hands and Catch card), so one class decides.</text>
<text x="570" y="627" font-size="12" fill="#1a1a1a" xml:space="preserve">A test proves Game obeys any rule: a reversed rule gives the mirrored game.</text>
<rect x="40" y="652" width="1043" height="96" rx="6" fill="#fef7e0" stroke="#b06000" stroke-width="1.8"/>
<text x="52" y="674" font-size="15" font-weight="700" fill="#1a1a1a">The honest correction</text>
<text x="52" y="692" font-size="12" fill="#1a1a1a" xml:space="preserve">The architecture first said "one class and one line at start-up". The measured figure is one class and about 20 lines in the start-up file:</text>
<text x="52" y="709" font-size="12" fill="#1a1a1a" xml:space="preserve">a rule that can be switched on needs a switch. The document now states the measured figure. Open-closed held where it matters: no game file was edited.</text>
<text x="52" y="726" font-size="12" fill="#1a1a1a" xml:space="preserve">The brief does not ask for requirement 13 to be implemented (line 165). It was built as evidence for questions 3a and 3b, with 19 tests written first.</text>
