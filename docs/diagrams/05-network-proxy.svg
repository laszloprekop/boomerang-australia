<text x="561" y="340" font-size="12" fill="#1a56c4" text-anchor="middle" xml:space="preserve">TCP port 2048 · SocketConnection (object streams)</text>
<rect x="40" y="452" width="372" height="196" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="52" y="474" font-size="15" font-weight="700" fill="#1a1a1a">Server to client  (ServerMessage)</text>
<text x="52" y="492" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">Tell(event)        show it, no reply</text>
<text x="52" y="509" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">AskCard(request)   reply: CardAnswer(site)</text>
<text x="52" y="526" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">AskChoice(request) reply: ChoiceAnswer(index)</text>
<text x="52" y="543" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">Bye                the session is over</text>
<text x="52" y="560" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve"></text>
<text x="52" y="577" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">Each has deliverTo(player): the message</text>
<text x="52" y="594" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">carries out itself on the local player</text>
<text x="52" y="611" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">(Command). The client has no chain of</text>
<text x="52" y="628" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">ifs on message kinds or on words.</text>
<rect x="426" y="452" width="296" height="196" rx="6" fill="#fffbe6" stroke="#c9a400" stroke-width="1.0"/>
<text x="438" y="474" font-size="15" font-weight="700" fill="#1a1a1a">What travels</text>
<text x="438" y="492" font-size="12" fill="#1a1a1a" xml:space="preserve">The game's own values: requests, events,</text>
<text x="438" y="509" font-size="12" fill="#1a1a1a" xml:space="preserve">scores. Nothing is defined twice.</text>
<text x="438" y="526" font-size="12" fill="#1a1a1a" xml:space="preserve"></text>
<text x="438" y="543" font-size="12" fill="#1a1a1a" xml:space="preserve">Stance: they carry java.io.Serializable,</text>
<text x="438" y="560" font-size="12" fill="#1a1a1a" xml:space="preserve">a JDK marker inside the game package.</text>
<text x="438" y="577" font-size="12" fill="#1a1a1a" xml:space="preserve">Cost found by a real run: a hand had to</text>
<text x="438" y="594" font-size="12" fill="#1a1a1a" xml:space="preserve">be copied (subList is no real list).</text>
<text x="438" y="611" font-size="12" fill="#1a1a1a" xml:space="preserve">Way out: one new class behind</text>
<text x="438" y="628" font-size="12" fill="#1a1a1a" xml:space="preserve">IConnection, a text encoding.</text>
<rect x="736" y="452" width="347" height="196" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="748" y="474" font-size="15" font-weight="700" fill="#1a1a1a">When something goes wrong</text>
<text x="748" y="492" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">IOException            SocketConnection</text>
<text x="748" y="509" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">  becomes ConnectionLost    (adapter)</text>
<text x="748" y="526" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">ConnectionLost         RemotePlayer</text>
<text x="748" y="543" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">  becomes PlayerLost   on await()</text>
<text x="748" y="560" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">PlayerLost             Game</text>
<text x="748" y="577" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">  GameAborted to the others, rethrown</text>
<text x="748" y="594" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">main prints one sentence, exit status 1</text>
<text x="748" y="611" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve"></text>
<text x="748" y="628" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" xml:space="preserve">No time limit: a silent player waits.</text>
<rect x="40" y="664" width="1043" height="70" rx="6" fill="#fce8e6" stroke="#b3261e" stroke-width="1.6"/>
<text x="52" y="686" font-size="15" font-weight="700" fill="#1a1a1a">The original</text>
<text x="52" y="704" font-size="12" fill="#1a1a1a" xml:space="preserve">One class is server, client and player. It sends sentences and the client looks for the words "Type", "keep" and "winner" to decide what to do (lines 52 to 66).</text>
<text x="52" y="721" font-size="12" fill="#1a1a1a" xml:space="preserve">Its readMessage swallows every exception and returns an empty text, so a broken connection looks like an empty answer.</text>
