<polygon points="190.0,422.0 198.2,425.7 198.2,418.3" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<rect x="549.04" y="406" width="81.92" height="17" fill="#ffffff"/>
<text x="590" y="418" font-size="12" fill="#5f6368" text-anchor="middle" xml:space="preserve">site letter</text>
<polyline points="190,450 850,450" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="850.0,450.0 841.8,446.3 841.8,453.7" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
