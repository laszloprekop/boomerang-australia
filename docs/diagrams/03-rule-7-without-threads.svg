<text x="340" y="584" font-size="12" fill="#5f6368" text-anchor="middle" xml:space="preserve">show(CardsShown)   steps 2 to 6</text>
<polyline points="190,618 660,618" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="660.0,618.0 651.8,614.3 651.8,621.7" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
