<text x="320" y="262" font-size="12" fill="#5f6368" text-anchor="middle" xml:space="preserve">selectCard(hand, draft)</text>
<rect x="60" y="312" width="880" height="180" rx="8" fill="#e6f4ea" fill-opacity="0.45" stroke="#137333" stroke-width="1" stroke-dasharray="4 4"/>
<text x="70" y="330" font-size="13" fill="#137333" font-weight="700" text-anchor="start" xml:space="preserve">2  Collect the answers, seat by seat, on one thread.</text>
<polyline points="190,362 470,362" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="470.0,362.0 461.8,358.3 461.8,365.7" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<rect x="272.48" y="344" width="55.040000000000006" height="17" fill="#ffffff"/>
<text x="300" y="356" font-size="12" fill="#5f6368" text-anchor="middle" xml:space="preserve">await()</text>
<polyline points="470,378 190,378" fill="none" stroke="#3c4043" stroke-width="1.5" stroke-dasharray="6 4"/>
<polygon points="190.0,378.0 198.2,381.7 198.2,374.3" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
