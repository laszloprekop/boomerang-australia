<rect x="955" y="150" width="150" height="150" rx="6" fill="#fffbe6" stroke="#c9a400" stroke-width="1.0"/>
<text x="967" y="172" font-size="15" font-weight="700" fill="#1a1a1a">Why no thread</text>
<text x="967" y="190" font-size="12" fill="#1a1a1a" xml:space="preserve">Asking does not</text>
<text x="967" y="207" font-size="12" fill="#1a1a1a" xml:space="preserve">wait. A remote</text>
<text x="967" y="224" font-size="12" fill="#1a1a1a" xml:space="preserve">player's question</text>
<text x="967" y="241" font-size="12" fill="#1a1a1a" xml:space="preserve">is already on the</text>
<text x="967" y="258" font-size="12" fill="#1a1a1a" xml:space="preserve">wire; the answer</text>
<text x="967" y="275" font-size="12" fill="#1a1a1a" xml:space="preserve">waits in the</text>
<text x="967" y="292" font-size="12" fill="#1a1a1a" xml:space="preserve">connection.</text>
<rect x="955" y="312" width="150" height="180" rx="6" fill="#fffbe6" stroke="#c9a400" stroke-width="1.0"/>
<text x="967" y="334" font-size="15" font-weight="700" fill="#1a1a1a">A refused answer</text>
<text x="967" y="352" font-size="12" fill="#1a1a1a" xml:space="preserve">Not a card of the</text>
<text x="967" y="369" font-size="12" fill="#1a1a1a" xml:space="preserve">hand: the same</text>
<text x="967" y="386" font-size="12" fill="#1a1a1a" xml:space="preserve">player is asked</text>
<text x="967" y="403" font-size="12" fill="#1a1a1a" xml:space="preserve">again, with</text>
<text x="967" y="420" font-size="12" fill="#1a1a1a" xml:space="preserve">`refused` set.</text>
<text x="967" y="437" font-size="12" fill="#1a1a1a" xml:space="preserve">The others were</text>
<text x="967" y="454" font-size="12" fill="#1a1a1a" xml:space="preserve">already asked.</text>
<text x="967" y="471" font-size="12" fill="#1a1a1a" xml:space="preserve">A value, not an</text>
<text x="967" y="488" font-size="12" fill="#1a1a1a" xml:space="preserve">exception.</text>
<rect x="955" y="504" width="150" height="176" rx="6" fill="#fce8e6" stroke="#b3261e" stroke-width="1.6"/>
<text x="967" y="526" font-size="15" font-weight="700" fill="#1a1a1a">The original</text>
<text x="967" y="544" font-size="12" fill="#1a1a1a" xml:space="preserve">lines 337 to 362:</text>
<text x="967" y="561" font-size="12" fill="#1a1a1a" xml:space="preserve">a thread pool per</text>
<text x="967" y="578" font-size="12" fill="#1a1a1a" xml:space="preserve">pick and a loop</text>
<text x="967" y="595" font-size="12" fill="#1a1a1a" xml:space="preserve">that sleeps 100 ms,</text>
<text x="967" y="612" font-size="12" fill="#1a1a1a" xml:space="preserve">because one call</text>
<text x="967" y="629" font-size="12" fill="#1a1a1a" xml:space="preserve">asked and waited.</text>
<text x="60" y="720" font-size="13" fill="#1a1a1a" text-anchor="start" xml:space="preserve">DraftPhase.selectCards: two loops. The first fills `answers`, the second reads them. Nothing is shown in between.</text>
<text x="60" y="740" font-size="13" fill="#5f6368" text-anchor="start" xml:space="preserve">Step 1 selects the Throw card: it is never in CardsShown (Draft.shown drops the first card). Cost of no threads: a lost player is noticed when collected.</text>
</svg>
