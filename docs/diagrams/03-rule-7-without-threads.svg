<text x="780" y="462" font-size="12" fill="#5f6368" text-anchor="middle" xml:space="preserve">site letter</text>
<rect x="60" y="504" width="880" height="176" rx="8" fill="#fef7e0" fill-opacity="0.45" stroke="#b06000" stroke-width="1" stroke-dasharray="4 4"/>
<text x="70" y="522" font-size="13" fill="#b06000" font-weight="700" text-anchor="start" xml:space="preserve">3  Only now: move the cards, pass the hands, show.</text>
<text x="204" y="548" font-size="12" fill="#1a1a1a" font-family="Menlo, Consolas, monospace" text-anchor="start" xml:space="preserve">each card to its draft;  hands = pass(hands, passing.hands)   (steps 1 to 5)</text>
<polyline points="190,590 470,590" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="470.0,590.0 461.8,586.3 461.8,593.7" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
