<text x="52" y="650" font-size="12" fill="#1a1a1a" xml:space="preserve">selectCard returns at once</text>
<text x="52" y="667" font-size="12" fill="#1a1a1a" xml:space="preserve">with an answer that comes</text>
<text x="52" y="684" font-size="12" fill="#1a1a1a" xml:space="preserve">later. So the game can ask</text>
<text x="52" y="701" font-size="12" fill="#1a1a1a" xml:space="preserve">all players before it reads</text>
<text x="52" y="718" font-size="12" fill="#1a1a1a" xml:space="preserve">any answer: rule 7.</text>
