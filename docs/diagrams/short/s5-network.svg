<rect width="1123" height="794" fill="#ffffff"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#1a1a1a">Network: a remote human is a player like any other</text>
<text x="40" y="70" font-size="14" fill="#5f6368">The game talks to IPlayer. Whether the answer crosses a socket is not its business.</text>
