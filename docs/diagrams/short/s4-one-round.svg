<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="297mm" height="210mm" font-family="Helvetica, Arial, sans-serif">
<rect width="1123" height="794" fill="#ffffff"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#1a1a1a">One round, and who does what</text>
<text x="40" y="70" font-size="14" fill="#5f6368">Game conducts. Each step calls one seam or sends one event. Four rounds, then the result.</text>
<text x="1083" y="776" font-size="11" fill="#9a9a9a" text-anchor="end">Boomerang Australia in Kotlin · short 4</text>
