<text x="690.0" y="215.5" font-size="13" fill="#5f6368" text-anchor="middle" xml:space="preserve">first card = Throw</text>
<text x="690.0" y="233.5" font-size="13" fill="#5f6368" text-anchor="middle" xml:space="preserve">IPlayer · IPassingRule</text>
