<text x="953.0" y="449.0" font-size="13" fill="#5f6368" text-anchor="middle" xml:space="preserve">the game asks, never decides</text>
<text x="953.0" y="467.0" font-size="13" fill="#5f6368" text-anchor="middle" xml:space="preserve">the root does the wiring</text>
<text x="40" y="570" font-size="13" fill="#5f6368" text-anchor="start" xml:space="preserve">The seam was placed because the brief named this change. Without a named change there is no interface.</text>
