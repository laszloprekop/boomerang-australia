<polygon points="176.0,768.0 167.8,764.3 167.8,771.7" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<text x="182.0" y="772" font-size="12" fill="#5f6368" text-anchor="start" xml:space="preserve">reads</text>
<rect x="236.0" y="761" width="18" height="13" rx="3" fill="#e8f0fe" stroke="#1a56c4" stroke-width="1.8"/>
<text x="264.0" y="772" font-size="12" fill="#5f6368" text-anchor="start" xml:space="preserve">seam</text>
<rect x="311.6" y="761" width="18" height="13" rx="3" fill="#fce8e6" stroke="#b3261e" stroke-width="1.6"/>
<text x="339.6" y="772" font-size="12" fill="#5f6368" text-anchor="start" xml:space="preserve">the original's faults</text>
<rect x="496.0" y="761" width="18" height="13" rx="3" fill="#fef7e0" stroke="#b06000" stroke-width="1.8"/>
<text x="524.0" y="772" font-size="12" fill="#5f6368" text-anchor="start" xml:space="preserve">known limits</text>
</svg>
