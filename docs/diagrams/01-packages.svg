<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1123 794" width="297mm" height="210mm" font-family="Helvetica, Arial, sans-serif">
<rect width="1123" height="794" fill="#ffffff"/>
<text x="40" y="46" font-size="24" font-weight="700" fill="#1a1a1a">Packages: every dependency points inward</text>
<text x="40" y="70" font-size="14" fill="#5f6368">Six packages, each with one reason to change. The game package owns the interfaces, the outer ones implement them.</text>
<text x="1083" y="776" font-size="11" fill="#9a9a9a" text-anchor="end">Boomerang Australia in Kotlin · diagram 1</text>
<rect x="40" y="100" width="1043" height="78" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="52" y="122" font-size="15" font-weight="700" fill="#1a1a1a">boomerang · App.kt  (the composition root)</text>
<text x="52" y="141" font-size="13" fill="#1a1a1a" xml:space="preserve">The only place that names concrete classes of several packages: main, parseArguments, runServer, runClient.</text>
<text x="52" y="159" font-size="13" fill="#1a1a1a" xml:space="preserve">Changes when: a part is added or swapped (a new edition, a new passing rule, a new transport).</text>
<rect x="386" y="300" width="351" height="290" rx="6" fill="#e8f0fe" stroke="#1a56c4" stroke-width="1.8"/>
<text x="398" y="322" font-size="15" font-weight="700" fill="#1a1a1a">boomerang.game</text>
<text x="398" y="341" font-size="13" fill="#1a1a1a" xml:space="preserve">Rules 1 to 12. No console, no socket, no thread.</text>
<text x="398" y="359" font-size="13" fill="#1a1a1a" xml:space="preserve"></text>
<text x="398" y="377" font-size="13" fill="#1a1a1a" xml:space="preserve">Game · DraftPhase · ScoringPhase</text>
<text x="398" y="395" font-size="13" fill="#1a1a1a" xml:space="preserve">History · Edition · Card · Draft · Score</text>
<text x="398" y="413" font-size="13" fill="#1a1a1a" xml:space="preserve"></text>
<text x="398" y="431" font-size="13" fill="#1a1a1a" xml:space="preserve">Owns the four seams:</text>
<text x="398" y="449" font-size="13" fill="#1a1a1a" xml:space="preserve">IPlayer · IScoringCategory</text>
<text x="398" y="467" font-size="13" fill="#1a1a1a" xml:space="preserve">IPassingRule · IShuffler</text>
<text x="398" y="485" font-size="13" fill="#1a1a1a" xml:space="preserve"></text>
<text x="398" y="503" font-size="13" fill="#1a1a1a" xml:space="preserve">Changes when: a rule of the draft or of</text>
<text x="398" y="521" font-size="13" fill="#1a1a1a" xml:space="preserve">a round changes.</text>
<text x="398" y="539" font-size="13" fill="#1a1a1a" xml:space="preserve">Imports: kotlin.* and java.io.Serializable only.</text>
<rect x="40" y="250" width="280" height="130" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="52" y="272" font-size="15" font-weight="700" fill="#1a1a1a">boomerang.australia</text>
<text x="52" y="291" font-size="13" fill="#1a1a1a" xml:space="preserve">One edition as data: the 28 cards,</text>
<text x="52" y="309" font-size="13" fill="#1a1a1a" xml:space="preserve">the symbols, which scoring classes</text>
<text x="52" y="327" font-size="13" fill="#1a1a1a" xml:space="preserve">with which names and values.</text>
<text x="52" y="345" font-size="13" fill="#1a1a1a" xml:space="preserve">Changes when: Australia's data changes.</text>
<rect x="40" y="460" width="280" height="150" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="52" y="482" font-size="15" font-weight="700" fill="#1a1a1a">boomerang.scoring</text>
<text x="52" y="501" font-size="13" fill="#1a1a1a" xml:space="preserve">Scoring rules named by mechanism:</text>
<text x="52" y="519" font-size="13" fill="#1a1a1a" xml:space="preserve">ThrowCatchDifference, NewSites,</text>
<text x="52" y="537" font-size="13" fill="#1a1a1a" xml:space="preserve">RegionBonus, SymbolSum, SymbolPairs,</text>
<text x="52" y="555" font-size="13" fill="#1a1a1a" xml:space="preserve">ChosenSymbolCount.</text>
<text x="52" y="573" font-size="13" fill="#1a1a1a" xml:space="preserve">Changes when: a new way of scoring</text>
<text x="52" y="591" font-size="13" fill="#1a1a1a" xml:space="preserve">appears (a new edition may need one).</text>
<rect x="803" y="250" width="250" height="130" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="815" y="272" font-size="15" font-weight="700" fill="#1a1a1a">boomerang.players</text>
<text x="815" y="291" font-size="13" fill="#1a1a1a" xml:space="preserve">Local kinds of player:</text>
<text x="815" y="309" font-size="13" fill="#1a1a1a" xml:space="preserve">BotPlayer, ConsolePlayer.</text>
<text x="815" y="327" font-size="13" fill="#1a1a1a" xml:space="preserve">All text for a person is here.</text>
<text x="815" y="345" font-size="13" fill="#1a1a1a" xml:space="preserve">Changes when: the console changes.</text>
<rect x="803" y="460" width="250" height="150" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="815" y="482" font-size="15" font-weight="700" fill="#1a1a1a">boomerang.net</text>
<text x="815" y="501" font-size="13" fill="#1a1a1a" xml:space="preserve">RemotePlayer, ClientSession,</text>
<text x="815" y="519" font-size="13" fill="#1a1a1a" xml:space="preserve">IConnection and the messages,</text>
<text x="815" y="537" font-size="13" fill="#1a1a1a" xml:space="preserve">SocketConnection, SocketListener.</text>
<text x="815" y="555" font-size="13" fill="#1a1a1a" xml:space="preserve">Changes when: the transport</text>
<text x="815" y="573" font-size="13" fill="#1a1a1a" xml:space="preserve">changes.</text>
<polyline points="561.5,178 561.5,300" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="561.5,300.0 565.2,291.8 557.8,291.8" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
