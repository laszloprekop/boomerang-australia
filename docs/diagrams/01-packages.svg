<polyline points="928.636,178 928.636,214.0 928.0,214.0 928.0,250" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="928.0,250.0 931.7,241.8 924.3,241.8" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<polyline points="1074.656,178 1075,535 1053,535.0" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="1053.0,535.0 1061.2,538.7 1061.2,531.3" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<polyline points="180.0,380 180.0,460" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="180.0,460.0 183.7,451.8 176.3,451.8" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<polyline points="320,315.0 353.0,315.0 353.0,329.0 386,329.0" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="386.0,329.0 377.8,325.3 377.8,332.7" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<polyline points="320,535.0 353.0,535.0 353.0,532.0 386,532.0" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="386.0,532.0 377.8,528.3 377.8,535.7" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<polyline points="803,315.0 770.0,315.0 770.0,329.0 737,329.0" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="737.0,329.0 745.2,332.7 745.2,325.3" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<polyline points="803,535.0 770.0,535.0 770.0,532.0 737,532.0" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="737.0,532.0 745.2,535.7 745.2,528.3" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<rect x="386" y="620" width="697" height="96" rx="6" fill="#fffbe6" stroke="#c9a400" stroke-width="1.0"/>
<text x="398" y="642" font-size="15" font-weight="700" fill="#1a1a1a">Held by a test, not by a promise</text>
<text x="398" y="661" font-size="13" fill="#1a1a1a" xml:space="preserve">DependencyRulesTest reads the source files and checks their imports against these arrows (8 tests).</text>
<text x="398" y="679" font-size="13" fill="#1a1a1a" xml:space="preserve">The original: one file, one class, default package. Rules, console, sockets and threads in the same methods.</text>
<text x="398" y="697" font-size="13" fill="#1a1a1a" xml:space="preserve">Dependency inversion: Game calls IPlayer; it never learns whether a bot, a console or a socket answers.</text>
<polyline points="40,768 62,768" fill="none" stroke="#3c4043" stroke-width="1.5"/>
<polygon points="62.0,768.0 53.8,764.3 53.8,771.7" fill="#3c4043" stroke="#3c4043" stroke-width="1.5"/>
<text x="68" y="772" font-size="12" fill="#5f6368" text-anchor="start" xml:space="preserve">depends on (imports)</text>
<rect x="218.0" y="761" width="18" height="13" rx="3" fill="#e8f0fe" stroke="#1a56c4" stroke-width="1.8"/>
<text x="246.0" y="772" font-size="12" fill="#5f6368" text-anchor="start" xml:space="preserve">owns the interfaces</text>
<rect x="389.6" y="761" width="18" height="13" rx="3" fill="#fffbe6" stroke="#c9a400" stroke-width="1.0"/>
<text x="417.6" y="772" font-size="12" fill="#5f6368" text-anchor="start" xml:space="preserve">evidence</text>
</svg>
